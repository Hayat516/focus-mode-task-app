<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus mode task app</title>
    <link rel="stylesheet" href="focus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <main class="app">

        <header class="app__header">
            <h1>Focus Mode</h1>
            <p class="subtitle">Stay locked in. One task at a time.</p>
        </header>

        <section class="task-input">
            <input type="text" id="taskInput" placeholder="What do you need to do?">
            <button id="addBtn">Add</button>
        </section>

        <p id="focusMessage"></p>

        <p id="errorMessage" class="error-message"></p>

        <section class="task-container">
            <ul id="taskList"></ul>
        </section>

        <section class="controls">
            <button id="focusBtn">Focus Mode</button>
        </section>

    </main>
</body>


<script type="module" src="./js/main.js"></script>

</html>
